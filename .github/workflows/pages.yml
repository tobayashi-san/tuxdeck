# The project website (site/) on GitHub Pages, with the screenshots and icon from the repo.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "assets/icon/tuxdeck.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp docs/images/editor.png docs/images/plugins.png docs/images/devices.svg docs/images/social-preview.png \
            assets/icon/tuxdeck.svg _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
