<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>TuxDeck</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand" title="Stream Deck for Linux" data-i18n-attr="title">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <rect x="2" y="6" width="28" height="20" rx="5" fill="#0d0d0d" stroke="#555"/>
        <rect x="6" y="10" width="5" height="5" rx="1.5" fill="#3b82f6"/>
        <rect x="13.5" y="10" width="5" height="5" rx="1.5" fill="#ddd"/>
        <rect x="21" y="10" width="5" height="5" rx="1.5" fill="#ddd"/>
        <rect x="6" y="17" width="5" height="5" rx="1.5" fill="#ddd"/>
        <rect x="13.5" y="17" width="5" height="5" rx="1.5" fill="#ddd"/>
        <rect x="21" y="17" width="5" height="5" rx="1.5" fill="#ddd"/>
      </svg>
      <span>TuxDeck</span>
    </div>

    <div class="tb-group">
      <label for="device-select" class="tb-label" data-i18n>Device</label>
      <select id="device-select" class="select"></select>
      <span id="device-status" class="status-dot off" role="img"></span>
    </div>

    <div class="tb-group">
      <label for="profile-select" class="tb-label" data-i18n>Profile</label>
      <select id="profile-select" class="select wide"></select>
      <button id="profile-menu-btn" class="icon-btn" title="Profile options" data-i18n-attr="title" aria-haspopup="menu"><span class="ei" aria-hidden="true">&#xee4b;</span></button>
    </div>

    <div class="tb-group brightness" title="Brightness" data-i18n-attr="title">
      <span class="ei" aria-hidden="true">&#xeaae;</span>
      <input id="brightness" type="range" min="0" max="100" step="1" value="70" aria-label="Brightness" data-i18n-attr="aria-label">
      <span id="brightness-val" class="tb-value">–</span>
    </div>

    <div class="tb-right">
    <button id="sidebar-btn" class="btn sidebar-btn" title="Show the action list" data-i18n-attr="title" aria-controls="sidebar" aria-expanded="false">
      <span class="ei" aria-hidden="true">&#xee1b;</span>
      <span data-i18n>Actions</span>
    </button>
    <button id="market-btn" class="btn market-btn" title="Install and manage plugins" data-i18n-attr="title">
      <span class="ei" aria-hidden="true">&#xeee7;</span>
      <span data-i18n>Plugins</span>
    </button>
    <span id="conn-indicator" class="conn"></span>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings" data-i18n-attr="title,aria-label">
      <span class="ei" aria-hidden="true">&#xef3a;</span>
    </button>
    </div>
    <input id="import-input" type="file" hidden accept=".streamDeckProfile,.streamDeckPlugin,.streamDeckIconPack">
  </header>

  <main id="main">
    <section id="workspace">
      <div id="canvas-area">
        <div id="compat-banner" class="compat-banner" role="status" hidden></div>
        <div id="crumbs"></div>
        <div id="device-wrap">
          <div id="device" class="device"></div>
        </div>
        <div id="pagebar"></div>
        <div id="trash" class="trash" aria-label="Trash" data-i18n-attr="aria-label">
          <span class="ei" aria-hidden="true">&#xf00a;</span>
          <span data-i18n>Drop here to delete</span>
        </div>
      </div>
      <section id="editor" aria-label="Properties" data-i18n-attr="aria-label"></section>
    </section>

    <aside id="sidebar" aria-label="Actions" data-i18n-attr="aria-label">
      <div class="search">
        <input id="action-search" type="search" class="text" placeholder="Search actions…" data-i18n-attr="placeholder" autocomplete="off" spellcheck="false">
      </div>
      <div id="catalogue"></div>
    </aside>
    <section id="market" class="market" hidden aria-label="Plugins"></section>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <div id="file-drop" aria-hidden="true"><span data-i18n>Drop to import (profile, plugin or icon pack)</span></div>

  <dialog id="settings-dialog" class="modal">
    <form method="dialog">
      <h2 data-i18n>Settings</h2>
      <label class="check modal-check">
        <input id="set-cmd" type="checkbox">
        <span data-i18n>Treat ⌘ (Mac profiles) as Ctrl</span>
      </label>
      <label class="modal-field">
        <span data-i18n>Platform reported to plugins</span>
        <select id="set-platform" class="select">
          <option value="mac">macOS</option>
          <option value="windows">Windows</option>
          <option value="linux">Linux</option>
        </select>
      </label>
      <label class="modal-field">
        <span data-i18n>Language</span>
        <select id="set-language" class="select">
          <option value="auto" data-i18n>System language</option>
        </select>
      </label>
      <label class="modal-field" id="set-touch-row" hidden>
        <span data-i18n>Touch point color (Neo)</span>
        <input id="set-touch" type="color" class="color">
      </label>
      <label class="modal-field" id="set-injector-row" hidden>
        <span data-i18n>Send keyboard input via</span>
        <select id="set-injector" class="select">
          <option value="auto" data-i18n>Automatic</option>
          <option value="hyprctl">hyprctl (Hyprland)</option>
          <option value="wtype">wtype (Wayland)</option>
          <option value="xdotool">xdotool (X11)</option>
          <option value="uinput" data-i18n>uinput (virtual keyboard)</option>
        </select>
        <span id="set-injector-active" class="field-help"></span>
      </label>
      <h3 data-i18n>Devices</h3>
      <ul id="set-devices" class="device-list"></ul>
      <h3 data-i18n>Backups</h3>
      <p class="field-help" data-i18n>A backup contains all profiles, settings, plugin data and plugins. Profiles, settings and plugin data are also backed up automatically every day.</p>
      <label class="check modal-check">
        <input id="backup-iconpacks" type="checkbox">
        <span data-i18n>Include icon packs (can be large)</span>
      </label>
      <div class="backup-buttons">
        <button type="button" id="backup-create" class="btn" data-i18n>Download backup</button>
        <button type="button" id="backup-restore" class="btn" data-i18n>Restore from file…</button>
        <input id="backup-file" type="file" accept=".zip,.streamDeckProfilesBackup" hidden>
      </div>
      <ul id="backup-list" class="backup-list"></ul>
      <div class="modal-buttons">
        <button class="btn primary" value="close" data-i18n>Close</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
